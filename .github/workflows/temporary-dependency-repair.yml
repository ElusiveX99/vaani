name: Temporary dependency repair analysis

on:
  push:
    branches:
      - maintenance/rate-limiting-and-recovery

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Apply non-breaking dependency fixes
        run: npm audit fix
      - name: Verify dependency audit
        run: npm audit --audit-level=moderate
      - name: Reinstall from repaired lockfile
        run: npm ci
      - name: Verify lint
        run: npm run lint
      - name: Verify production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://vju.vercel.app
      - name: Commit verified lockfile repair
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: resolve transitive dependency vulnerabilities"
          git push
