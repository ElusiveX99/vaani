<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1450" role="img" aria-labelledby="title desc">
<title id="title">Vaani identity exploration — three monochrome directions</title><desc id="desc">Three early bespoke wordmark and abstract-symbol studies in monochrome. None is final.</desc>
<rect width="1600" height="1450" fill="#F4F1EA"/>
